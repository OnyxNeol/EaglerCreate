<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EaglerCreate — Python SDK Test Harness</title>
<style>
  :root {
    --bg: #0e121b;
    --panel: #161b27;
    --panel2: #1c2230;
    --border: #2a3142;
    --text: #e0e6f0;
    --text-dim: #8a93a6;
    --accent: #64cdb0;
    --accent2: #e8a838;
    --error: #e66a5e;
    --pass: #64cdb0;
    --fail: #e66a5e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    padding: 10px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    white-space: nowrap;
  }
  header .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--accent);
    color: #0e121b;
    font-weight: 700;
  }
  header .badge.offline {
    background: var(--border);
    color: var(--text-dim);
  }
  header .badge.loading {
    background: var(--accent2);
    color: #0e121b;
  }
  header .spacer { flex: 1; }
  header button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: background .15s;
  }
  header button:hover { background: var(--border); }
  header button:disabled { opacity: .4; cursor: default; }
  header button.primary {
    background: var(--accent);
    color: #0e121b;
    border-color: var(--accent);
    font-weight: 600;
  }
  header button.primary:hover { background: #7ee0c2; }

  main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left panel — 3D view + kinetic diagram */
  .left-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .view-container {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--bg);
  }
  #scene-canvas {
    display: block;
  }
  .view-overlay {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 12px;
    color: var(--text-dim);
    pointer-events: none;
  }
  .view-overlay .renderer-mode {
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .kinetic-diagram {
    height: 180px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .kinetic-diagram .label {
    font-size: 11px;
    color: var(--text-dim);
    padding: 4px 12px;
    border-bottom: 1px solid var(--border);
  }
  #kinetic-canvas {
    flex: 1;
    display: block;
  }

  /* Right panel — code editor + console + blocks */
  .right-panel {
    width: 420px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }
  .section {
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
  }
  .section-header {
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .section-header .count {
    font-size: 11px;
    background: var(--border);
    padding: 1px 6px;
    border-radius: 3px;
    color: var(--text);
  }
  .code-section { flex: 1; min-height: 0; }
  #python-code {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: none;
    padding: 12px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    resize: none;
    outline: none;
    tab-size: 4;
  }
  .console-section { height: 200px; flex-shrink: 0; }
  #console-output {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 12px;
    line-height: 1.5;
  }
  .console-line { white-space: pre-wrap; word-break: break-word; }
  .console-line.info { color: var(--text); }
  .console-line.python { color: var(--accent); }
  .console-line.error { color: var(--error); }
  .console-line.success { color: var(--pass); }
  .console-line.dim { color: var(--text-dim); }

  .blocks-section { max-height: 220px; flex-shrink: 0; }
  #blocks-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 12px;
  }
  .block-entry {
    padding: 4px 0;
    font-size: 12px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    border-bottom: 1px solid var(--border);
  }
  .block-entry .bid { color: var(--accent); }
  .block-entry .bmeta { color: var(--text-dim); }

  .tests-section { max-height: 200px; flex-shrink: 0; }
  #test-results {
    flex: 1;
    overflow-y: auto;
    padding: 6px 12px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 12px;
  }
  .test-entry { padding: 2px 0; }
  .test-entry .pass { color: var(--pass); }
  .test-entry .fail { color: var(--fail); }
  .test-entry .name { color: var(--text); }
  .test-summary {
    padding: 6px 0 2px;
    font-weight: 600;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
</style>
</head>
<body>
<header>
  <h1>EaglerCreate</h1>
  <span class="badge offline" id="py-status">Pyodide: Not Loaded</span>
  <span class="spacer"></span>
  <button id="btn-load-py">Load Python</button>
  <button id="btn-run" disabled>Run Python Code</button>
  <button id="btn-tests" disabled>Run Tests</button>
</header>
<main>
  <div class="left-panel">
    <div class="view-container">
      <canvas id="scene-canvas" width="740" height="500"></canvas>
      <div class="view-overlay">
        <span class="renderer-mode" id="renderer-mode">Initializing…</span>
      </div>
    </div>
    <div class="kinetic-diagram">
      <div class="label">Kinetic Network Diagram</div>
      <canvas id="kinetic-canvas" width="740" height="140"></canvas>
    </div>
  </div>
  <div class="right-panel">
    <div class="section code-section">
      <div class="section-header">Python Mod Code</div>
      <textarea id="python-code" spellcheck="false" placeholder="# Write your EaglerForge Python mod code here…"></textarea>
    </div>
    <div class="section console-section">
      <div class="section-header">Console</div>
      <div id="console-output"></div>
    </div>
    <div class="section blocks-section">
      <div class="section-header">Registered Blocks <span class="count" id="block-count">0</span></div>
      <div id="blocks-list"></div>
    </div>
    <div class="section tests-section">
      <div class="section-header">Test Results</div>
      <div id="test-results"></div>
    </div>
  </div>
</main>

<!-- EaglerCreate injector (sets globalThis.EaglerCreate and globalThis.EaglerCreateAssets) -->
<script src="/eagler-create-injector%20%282%29.js"></script>

<!-- Python bridge (sets globalThis.PythonBridge) -->
<script src="/src/client/eagler-forge-python.mjs"></script>

<!-- 3D scene setup (sets globalThis.EaglerCreateScene) -->
<script src="/test/scene.js"></script>

<!-- Test harness main logic -->
<script src="/test/harness.js"></script>
</body>
</html>
