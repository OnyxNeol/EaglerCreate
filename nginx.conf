user root;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        # Serve .mjs files as JavaScript for ES module imports
        location ~ \.mjs$ {
            default_type text/javascript;
        }

        # Externalized scripts keep embedded HTML strings out of proxy rewriting.
        location = / {
            root /usr/share/nginx/html/.base44/client;
            try_files /index.html =404;
            default_type text/html;
        }

        location = /eaglercraft {
            alias /usr/share/nginx/html/.base44/client/index.html;
            default_type text/html;
        }

        location / {
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
